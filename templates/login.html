{% extends 'base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/company-logo.png') }}" alt="شعار الشركة" class="login-logo" onerror="this.style.display='none'"><br>
                    شركة العلوم التكنولوجية للخدمات والاستشارات الهندسية<br>
                    <small class="text-muted">مشروع صيانة طريق الساحلي مصنع النجمة - كوبري القره بوللي</small>
                </h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">دخول</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
